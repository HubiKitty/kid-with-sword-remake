
workflows:
  zelda-mac-test:
    name: Zelda - test Mac M2
    instance_type: mac_mini_m2
    max_build_duration: 10

    environment:
      xcode: "27.2"

    scripts:
      - name: Sprawdzenie srodowiska
        script: |
          echo "=== SYSTEM ==="
          sw_vers
          uname -m

          echo "=== XCODE ==="
          xcodebuild -version

          echo "=== RAM ==="
          sysctl -n hw.memsize

          echo "=== DYSK ==="
          df -h .

          echo "=== PYTHON ==="
          python3 --version

          echo "=== NARZEDZIA ==="
          command -v brew || true
          command -v xcodegen || true
          command -v glslangValidator || true
          command -v zstd || true
          command -v dotnet || true

          echo "=== METAL ==="
          xcrun --find metal || true

          echo "=== KONIEC TESTU ==="

  zelda-tools:
    name: Zelda - instalacja narzedzi
    instance_type: mac_mini_m2
    max_build_duration: 35

    environment:
      xcode: "27.2"

    scripts:
      - name: Kontrola SDK iOS
        script: |
          set -eux
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --find metal
          git log -1 --oneline
          df -h .

      - name: Instalacja narzedzi
        script: |
          set -eux
          brew install xcodegen glslang
          brew install --cask dotnet-sdk
          python3 -m venv /tmp/zelda-venv
          /tmp/zelda-venv/bin/python -m pip install --upgrade pip
          /tmp/zelda-venv/bin/python -m pip install --no-cache-dir lz4 "capstone>=5,<6" fonttools nsz "zbic==1.0.1.post1" backports.zstd zstandard

      - name: Test narzedzi i skryptu
        script: |
          set -eux
          xcodegen --version
          dotnet --list-sdks
          glslangValidator --version
          /tmp/zelda-venv/bin/python -m pip show zbic
          /tmp/zelda-venv/bin/python scripts/build_ipa_from_nsp.py --help

  zelda-iphone17pro:
    name: Zelda Remake - iPhone 17 Pro (VNC)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: "27.2"

    scripts:
      - name: Instalacja narzedzi
        script: |
          set -euo pipefail
          brew install xcodegen glslang
          brew install --cask dotnet-sdk
          python3 -m venv /tmp/zelda-venv
          /tmp/zelda-venv/bin/python -m pip install --upgrade pip
          /tmp/zelda-venv/bin/python -m pip install --no-cache-dir \
            lz4 "capstone>=5,<6" fonttools nsz \
            "zbic==1.0.1.post1" backports.zstd zstandard

      - name: Pobierz NUP w Safari przez VNC
        script: |
          set -eu
          mkdir -p "$HOME/Downloads" "$CM_BUILD_DIR/zelda_input"
          echo "OTWORZ VNC: na Macu w Safari otworz SWOJ link SwissTransfer."
          echo "Wybierz pojedynczy plik NUP, NIE opcje Download all (ZIP)."
          echo "Zapisz plik do /Users/builder/Downloads."
          echo "Nie wklejaj linku do publicznych logow ani repozytorium."

          i=0
          while [ "$i" -lt 240 ]; do
            for p in "$HOME/Downloads"/*.nup "$CM_BUILD_DIR/zelda_input"/*.nup; do
              [ -f "$p" ] || continue
              bytes=$(stat -f%z "$p" 2>/dev/null || echo 0)
              if [ "$bytes" = "25622267860" ]; then
                printf '%s\n' "$p" > "$CM_BUILD_DIR/zelda-input-path.txt"
                echo "NUP OK - znaleziono kompletny plik o odpowiednim rozmiarze."
                exit 0
              fi
            done
            i=$((i+1))
            if [ $((i % 6)) -eq 0 ]; then
              echo "Czekam na zakonczenie pobierania... ${i}0 sekund."
            fi
            sleep 10
          done
          echo "BLAD: plik NUP nie zostal pobrany w ciagu 40 minut."
          exit 1

      - name: Kompilacja Zelda iOS
        script: |
          set -euo pipefail
          NUP=$(cat "$CM_BUILD_DIR/zelda-input-path.txt")
          test -f "$NUP"
          mkdir -p "$CM_BUILD_DIR/zelda_out"

          printf 'DM_UPSCALER=metalfx\n' > "$CM_BUILD_DIR/ios_env.txt"
          /tmp/zelda-venv/bin/python \
            scripts/build_ipa_from_nsp.py "$NUP" \
            --platform ios \
            --romfs separate \
            --gpu none \
            --keep-extracted \
            --work-dir "$CM_BUILD_DIR/zelda_work" \
            --env-file "$CM_BUILD_DIR/ios_env.txt" \
            --out "$CM_BUILD_DIR/zelda_out/OcarinaOfTime-iPhone17Pro.ipa" \
            --progress lines

      - name: Sprawdzenie wyniku
        script: |
          set -e
          ls -lh "$CM_BUILD_DIR/zelda_out"
          test -s "$CM_BUILD_DIR/zelda_out/OcarinaOfTime-iPhone17Pro.ipa"
          ls -lh "$CM_BUILD_DIR/zelda_work/extract/v131072/RomFS.img"
          echo "UWAGA: RomFS.img przygotujemy oddzielnie na Windowsie."
          echo "Nie ma go w artefaktach, aby uniknac problemow z plikiem ok. 26 GB."

    artifacts:
      - zelda_out/*.ipa
      - zelda_work/logs/*.log
