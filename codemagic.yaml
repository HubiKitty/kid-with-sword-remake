
workflows:
  zelda-mac-test:
    name: Zelda - test Mac M2
    instance_type: mac_mini_m2
    max_build_duration: 10

    environment:
      xcode: "27.2"

    scripts:
      - name: Sprawdzenie srodowiska
        script: |
          echo "=== SYSTEM ==="
          sw_vers
          uname -m

          echo "=== XCODE ==="
          xcodebuild -version

          echo "=== RAM ==="
          sysctl -n hw.memsize

          echo "=== DYSK ==="
          df -h .

          echo "=== PYTHON ==="
          python3 --version

          echo "=== NARZEDZIA ==="
          command -v brew || true
          command -v xcodegen || true
          command -v glslangValidator || true
          command -v zstd || true
          command -v dotnet || true

          echo "=== METAL ==="
          xcrun --find metal || true

          echo "=== KONIEC TESTU ==="
